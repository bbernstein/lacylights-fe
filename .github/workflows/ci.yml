name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [26.x]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint (strict - warnings cause failure)
      run: |
        echo "Running ESLint with --max-warnings=0 (warnings cause failure)..."
        npm run lint:ci
    
    - name: Run TypeScript type check (strict - type errors cause failure)
      run: |
        echo "Running TypeScript type check with strict enforcement..."
        npm run type-check

  build:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    strategy:
      matrix:
        node-version: [26.x]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build

    - name: Build static export (RPi)
      run: npm run build:static

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    strategy:
      matrix:
        node-version: [26.x]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      if: matrix.node-version == '26.x'
      continue-on-error: true
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Audit production dependencies (blocking)
      run: npm audit --omit=dev --audit-level=high

    - name: Audit all dependencies (report only)
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Check for outdated dependencies
      run: |
        echo "Checking for outdated dependencies..."
        npm outdated || echo "ℹ️  Some dependencies may be outdated"
